disabled_rules:
  - line_length
  - trailing_whitespace
  - vertical_whitespace
  - function_body_length

opt_in_rules:
  - force_unwrapping
  - empty_count
  - contains_over_first_not_nil

included:
  - Games
  - Games Collection

excluded:
  - Bilder
  - .git
  - .gemini
  - setup_xcode_files.py

force_unwrapping: warning
